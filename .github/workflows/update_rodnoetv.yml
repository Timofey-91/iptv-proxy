name: Update Stream Links

on:
  schedule:
    - cron: '0 3 * * *' # Запуск каждый день в 03:00 UTC
  workflow_dispatch: # Возможность запустить вручную кнопкой в GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Чеккаут репозитория
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Запуск парсера
        run: node parse.js

      - name: Сохранение изменений в git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add streams.json
          git diff-index --quiet HEAD || git commit -m "Auto-update stream links"
          git push
