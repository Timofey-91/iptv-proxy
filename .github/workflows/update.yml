name: Update IPTV links

permissions:
  contents: write

on:
  schedule:
    - cron: "0 */12 * * *" # Строго раз в 12 часов (в 00:00 и 12:00)
  workflow_dispatch: # Оставляем кнопку для ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requirements
        run: pip install requests

      - name: Update config.json
        run: python update_config.py

      - name: Force Commit (История остается чистой)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          
          # Перезаписываем один и тот же коммит автоматизации
          git commit --amend -m "chore: auto-update IPTV links" || git commit -m "chore: auto-update IPTV links"
          git push --force origin HEAD:${{ github.ref_name }}
