name: Update IPTV link

on:
  schedule:
    - cron: "0 */6 * * *" # НАСТРОЕНО: Запуск каждые 1 час в свободную от очередей 11-ю минуту!
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install requests

      - name: Update config.json
        run: python update_config.py

      - name: Show updated config
        run: cat config.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update IPTV links"
            git push
          fi
