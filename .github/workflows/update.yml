name: Update IPTV links

permissions:
  contents: write

on:
  schedule:
    - cron: "0 * * * *" # Строго раз в час (в 00 минут)
  workflow_dispatch:   # Кнопка для ручного запуска

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Загружаем минимальную историю для безопасного Force Push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requirements
        run: pip install requests

      - name: Update config.json
        run: python update_config.py

      - name: Force Commit & Push (Защита от блокировок GitHub)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Если скрипт выше решил не менять файл (токен тот же), то завершаем работу
          if git diff --quiet config.json; then
            echo "Изменений в файле нет. Пропускаем push."
            exit 0
          fi
          
          git add config.json
          
          # Перезаписываем предыдущий коммит автоматизации (сохраняем историю чистой)
          git commit --amend -m "chore: auto-update IPTV config" || git commit -m "chore: auto-update IPTV config"
          
          # Принудительно заменяем коммит на сервере GitHub
          git push --force origin HEAD:${{{ github.ref_name }}}
